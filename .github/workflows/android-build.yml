name: Android ABI APKs

"on":
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build separate Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-version: '9.4.1'

      - name: Build ABI-split debug APKs
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify both ABI APKs and no universal APK
        shell: bash
        run: |
          set -euo pipefail
          output="app/build/outputs/apk/debug"
          arm64="$(find "$output" -type f -name '*arm64-v8a*.apk' -print -quit)"
          armv7="$(find "$output" -type f -name '*armeabi-v7a*.apk' -print -quit)"
          test -n "$arm64"
          test -n "$armv7"
          if find "$output" -type f -name '*universal*.apk' | grep -q .; then
            echo 'Universal APK was generated unexpectedly.' >&2
            exit 1
          fi
          mkdir -p dist/arm64-v8a dist/armeabi-v7a
          cp "$arm64" dist/arm64-v8a/kasir-saku-arm64-v8a.apk
          cp "$armv7" dist/armeabi-v7a/kasir-saku-armeabi-v7a.apk

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kasir-saku-arm64-v8a
          path: dist/arm64-v8a/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kasir-saku-armeabi-v7a
          path: dist/armeabi-v7a/*.apk
          if-no-files-found: error
          retention-days: 7
