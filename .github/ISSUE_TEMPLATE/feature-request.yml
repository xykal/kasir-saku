name: Feature request
description: Propose a user problem and a focused improvement.
title: "feature: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who encounters this and what are they trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful solution.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Offline, privacy, and hardware considerations
      description: Note data-loss, printer, payment, or device implications.
    validations:
      required: false
